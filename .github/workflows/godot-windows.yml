name: Construire Don't Play pour Windows

# À chaque modification du jeu Godot sur main : export Windows, puis publication du .zip
# dans la version « dev-latest » (Releases du dépôt), toujours au même lien de téléchargement.
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-windows
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre Godot en cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows

      - name: Télécharger Godot et les modèles d'export Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/godot "$T"
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$T"
          rm templates.tpz

      - name: Vérifier les textes du jeu
        run: python3 godot/tools/check_texts.py

      - name: Importer le projet
        run: ~/godot/godot --headless --path godot --import

      - name: Exporter pour Windows
        run: |
          out="$GITHUB_WORKSPACE/build/DontPlay"
          mkdir -p "$out"
          ~/godot/godot --headless --path godot --export-release "Windows Desktop" "$out/DontPlay.exe"
          test -f "$out/DontPlay.exe"
          # Les données du jeu sont à part (DontPlay.pck) : un .exe qui les contient
          # ressemble davantage, pour les antivirus, à un programme « emballé » suspect.
          test -f "$out/DontPlay.pck"
          cp CREDITS.md "$out/CREDITS.md"
          cp godot/LISEZMOI.txt "$out/LISEZMOI.txt"
          cd "$GITHUB_WORKSPACE/build" && zip -qr DontPlay-windows.zip DontPlay
          ls -la "$GITHUB_WORKSPACE/build"

      - name: Garder le build dans les artefacts du workflow
        uses: actions/upload-artifact@v4
        with:
          name: DontPlay-windows
          path: build/DontPlay

      - name: Publier la version de développement (dev-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub répond parfois 500 pendant l'envoi : on réessaie jusqu'à 4 fois
          for i in 1 2 3 4; do
            gh release delete dev-latest --yes --cleanup-tag || true
            if gh release create dev-latest build/DontPlay-windows.zip \
              --target "$GITHUB_SHA" --prerelease \
              --title "Don't Play - version de développement" \
              --notes "Build automatique du commit ${GITHUB_SHA::7}. Télécharge DontPlay-windows.zip, extrais-le, lance DontPlay.exe. Voir LISEZMOI.txt dans le zip."; then
              exit 0
            fi
            echo "Échec de la publication, nouvel essai dans $((i * 15)) s"
            sleep $((i * 15))
          done
          exit 1
